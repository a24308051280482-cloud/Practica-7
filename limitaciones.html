<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos de la página y título -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>

    <!-- Carga de la biblioteca Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- Formulario de demostración de restricciones en campos -->
    <form action="" method="post">
        <!-- Campo desactivado (deshabilitado para la interacción) -->
        Ingresa tu nombre:
        <input type="text" name="nombre" disabled><br>

        <!-- Campo de contraseña restringido a un máximo de 5 caracteres -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>

        <!-- Área de texto en modo solo lectura -->
        Comentarios:
        <textarea name="comentarios" readonly>
Este es mi comentario y no se puede borrar
        </textarea><br>
    </form>
</body>
</html>
