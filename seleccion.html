<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Encabezado con codificación y dimensiones de pantalla -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>

    <!-- Importación de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- Estructura del formulario de selección -->
    <form action="" method="post"> 
        <!-- Entrada para texto libre -->
        Ingresa tu nombre:
        <input type="text" name="nombre">  
        <br>

        <!-- Menú desplegable de opciones múltiples -->
        Selecciona tu pais:
        <select name="pais"> 
            <option value="1">Argentina</option> 
            <option value="2">España</option>
            <option value="3">Mexico</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br>

        <!-- Acciones de envío y reseteo -->
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
