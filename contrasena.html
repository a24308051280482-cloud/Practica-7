<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configuración básica de metadatos y codificación de caracteres -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>

    <!-- Enlace a la librería externa de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- Contenedor principal del formulario con método de envío POST -->
    <form action="" method="post"> 
        <!-- Campo para la entrada de texto de usuario -->
        Ingresa tu usuario:
        <input type="text" name="usuario"> 

        <!-- Campo para la contraseña con caracteres ocultos -->
        Ingresa tu contraseña:
        <input type="password" name="pass">
        <br>

        <!-- Botones de acción para enviar y reiniciar los datos -->
        <input type="submit" value="enviar"> 
        <input type="reset" value="borrar"> 
    </form>
</body>
</html>
