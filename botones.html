<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos globales -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>

    <!-- Hoja de estilos externa para la iconografía -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- Primer formulario: Campos básicos y botones con etiqueta <button> -->
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>

    <h2>Formulario con archivos</h2>

    <!-- Segundo formulario: Subida de archivos adjuntos -->
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <input type="file" name="archivo">
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
