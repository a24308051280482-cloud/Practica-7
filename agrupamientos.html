<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos de cabecera -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>

    <!-- Enlace a hojas de estilo para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head> 
<body>
    <!-- Formulario estructurado con secciones lógicas -->
    <form action="" method="post">
        <!-- Primer grupo de datos: Información personal -->
        <fieldset>
            <legend>Datos personales</legend>
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>
            Documento valido:
            <input type="file" name="documento"><br>
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>

        <!-- Segundo grupo de datos: Información académica -->
        <fieldset>
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br>
            Certificado valido:
            <input type="file" name="certificado"><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>
        <br>

        <!-- Botones con elementos gráficos integrados -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
